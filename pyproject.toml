[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bazi-read"
version = "0.2.0"
description = "BaZi (Four Pillars of Destiny) chart calculation and interpretation workflow for AI agents."
readme = "README.md"
keywords = ["bazi", "八字", "four-pillars", "chinese-astrology", "ai-agent", "agent-skill"]
requires-python = ">=3.10"
dependencies = ["sxtwl==2.0.7", "tzdata==2026.6"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
bazi-read = "bazi_read.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
bazi_read = ["data/*.json"]
